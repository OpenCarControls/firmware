[package]
name = "core-interface"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-can = { workspace = true }
embedded-hal = { workspace = true }
embedded-hal-async = "1.0.0"
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
embedded-io-async = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
portable-atomic = { workspace = true }
# Hashes the car fingerprint for the read-write approval (no VIN stored in flash).
sha2 = { version = "0.10", default-features = false }

[build-dependencies]
prost-build = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
critical-section = { workspace = true }
embassy-time = { workspace = true, features = ["std"] }
# Supplies `__pender` for host tests that exercise timeouts.
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
