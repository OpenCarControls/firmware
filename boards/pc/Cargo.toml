[package]
name = "board-pc"
version = "0.1.0"
edition = "2024"

[dependencies]
core-interface    = { workspace = true }
embedded-can      = { workspace = true }
embassy-executor  = { workspace = true }
embassy-time      = { workspace = true }
critical-section  = { workspace = true }
rust-mqtt         = { workspace = true, features = ["log"] }
embedded-io-async = { workspace = true, features = ["std"] }
prost             = { workspace = true }
log               = { workspace = true }
# TLS for MQTT (mqtts://). ring instead of aws-lc-rs: it builds without cmake.
rustls            = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan         = { version = "4.0.0", default-features = false }

[dev-dependencies]
embassy-futures   = { workspace = true }
