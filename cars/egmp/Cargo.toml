[package]
name = "egmp-controller"
version = "0.1.0"
edition = "2024"

# What xtask checks the board's CAN config against (one entry per bus, in bus order).
# Set `fd = true` on a bus that carries CAN-FD frames: it never leaves listen-only mode.
[[package.metadata.opencar.can_buses]]
bitrate = 500000

[dependencies]
core-interface = { workspace = true }
embedded-can = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
embassy-executor = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
bitvec = { version = "1.0", default-features = false }

[build-dependencies]
build-utils = { path = "../../build-utils" }

[dev-dependencies]
critical-section = { workspace = true }
embassy-futures = { workspace = true }
# The host time driver, for tests that read the clock.
embassy-time = { workspace = true, features = ["std"] }
# Supplies `__pender` for the host tests.
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }

